<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alvie Montiel | W05 Rafting Project: Contact Us Page</title>
    <meta name="description"
      content="Display the Company location and contact information. It also ask the customer information like email and name, it also ask for the purpose of the message.">
    <meta name="author" content="Alvie Montiel">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/wwr-logo.png" alt="logo of White Water Rafting Company">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <section class="contact-container">
            <div class="header-section">
                <h1>White Water Rafting Company</h1>
                <p>8J82+37 Brgy, Sitio Aura, Mambuaya</p>
                <p>Cagayan De Oro City, Misamis Oriental</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </div>
            <div class="content-section">
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d986.9705541498383!2d124.600997!3d8.314502!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1791972196815!5m2!1sen!2sph"
                      allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
                <div class="form-column">
                    <form>
                        <div class="form-row">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" required>
                        </div>
                        <div class="form-row">
                            <label for="useremail">Email</label>
                            <input type="email" id="useremail" name="useremail" required>
                        </div>
                        <div class="form-row">
                            <label class="main-label">Message<br>Purpose</label>
                            <div class="form-input-group radio-group">
                                <div>
                                    <input type="radio" id="general_inquiry" name="message_purpose"
                                      value="general_inquiry" checked>
                                    <label for="general_inquiry">General Inquiry</label>
                                </div>
                                <div>
                                    <input type="radio" id="reservation_question"
                                      name="message_purpose" value="reservation_question">
                                    <label for="reservation_question">Reservation Question</label>
                                </div>
                                <div>
                                    <input type="radio" id="website_suggestion"
                                      name="message_purpose" value="website_suggestion">
                                    <label for="website_suggestion">Website Suggestion</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-row">
                            <label class="main-label" for="message">Message</label>
                            <div class="form-input-group">
                                <textarea id="message" name="message" rows="4"
                                  placeholder="Type here"></textarea>
                            </div>
                        </div>

                        <div class="newsletter-row">
                            <input type="checkbox" id="subscribe" name="subscribe" checked>
                            <label for="subscribe">Please Subscribe me to the monthyly
                                newsletter</label>
                        </div>
                        <button type="submit" class="submit-btn">Get in Touch!</button>
                    </form>
                </div>
            </div>
        </section>
        <section>
            <h2>We are Here to Serve You</h2>
            <div class=" trip">
                <figure>
                    <img src="images/employe-one.png" alt="first employee">
                    <figcaption>Built for Rafting</figcaption>
                </figure>
                <figure>
                    <img src="images/employe-two.png" alt="second employee">
                    <figcaption>Born to be a guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-three.png" alt="third employee">
                    <figcaption>Strong arms for rapids</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <p>©️2026 💦🚣White Water Rafting Company🚣💦 📍❇️Alvie Montiel❇️</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"> <img src="images/facebook-logo.svg"
                  alt="Facebook icon logo"></a>
            <a href="https://instagram.com"><img src="images/instagram-logo.svg"
                  alt="Instagram icon logo"></a>
            <a href="https://youtube.com"><img src="images/youtube-logo.svg"
                  alt="Youtube icon logo"></a>
        </nav>
    </footer>
</body>

</html>
