<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
    <link rel="stylesheet" href="styles/poll-fprm.css">
</head>

<body>

    <h1>WDD 130 / HTML Form - User Poll</h1>

    <form>
        <fieldset>
            <legend>Contact Information</legend>
            <div class="form-item label-narrow">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-item label-narrow">
                <label for="useremail">Email</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>
        </fieldset>
        <fieldset>
            <legend>Questions</legend>
            <div class="form-item label-wide">
                <label for="browser">What is your favorite internet browser?</label>
                <select name="browser" id="browser">
                    <option value="1">Chrome</option>
                    <option value="2">Firefox</option>
                    <option value="3">Safari</option>
                    <option value="4">Edge</option>
                    <option value="5">Brave</option>
                    <option value="6">Other</option>
                </select>
            </div>
            <div class="form-item label-wide">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="form-item">
                <label for="places">List the places you have lived</label>
                <textarea id="places" name="places" rows="4"
                  placeholder="Dumaguete City, Dipolog City, Cebu City, Siaton"></textarea>
            </div>
        </fieldset>
        <button type="submit">Submit Poll</button>
    </form>

</body>

</html>
